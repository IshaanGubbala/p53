engine: evoef2
rasp:
  enabled: true
  model_path: src/scoring/rasp_repo/output/cavity_models/best_model.pt
allosteric:
  enabled: true
  sites: ["Y220_POCKET"]
docking:
  enabled: true
  ligand: "PHI-KAN-083"
cache:
  enabled: true
  dir: processed/cache
  evoef2_repair_dir: processed/cache/evoef2_repair  # Persistent repaired PDB cache
  cache_individual_energies: true  # Store base_energy and mutant_energy separately
parallel:
  n_jobs: 8
recompute: false
evoef2:
  binary: /Users/ishaangubbala/Downloads/EvoEF2-master/EvoEF2
  repaired_pdb: Data/processed/cache/evoef2_repair/5a7051e8f97848d43b3747268825b29cafb5fa99d2e3fff6f58efcdb74e74cc3/AF-P04637-F1-model_v6.pdb
  chain_id: A

  # Multi-structure scoring configuration
  #
  # WEIGHTING GUIDELINES:
  # - Experimental structures (X-ray, cryo-EM) should be weighted HIGHER
  # - Predicted structures (AlphaFold, ESMFold) should be weighted LOWER
  # - Higher resolution = higher weight
  #
  # Typical weights:
  #   X-ray < 2.5 Å:    2.5
  #   X-ray 2.5-3.0 Å:  2.0
  #   Cryo-EM < 3.0 Å:  2.0
  #   AlphaFold high:   1.0
  #   AlphaFold medium: 0.7
  #   ESMFold:          0.5
  #
  structures:
    - id: alphafold
      pdb: Data/processed/cache/evoef2_repair/5a7051e8f97848d43b3747268825b29cafb5fa99d2e3fff6f58efcdb74e74cc3/AF-P04637-F1-model_v6.pdb
      chain_id: A
      type: alphafold
      plddt: 85  # Approximate mean pLDDT for p53 core domain
      weight: 1.0  # Prediction - lower weight
    - id: 2ocj_core
      pdb: Data/raw/experimental_pdbs/2OCJ_chainA.pdb
      chain_id: A
      type: xray
      resolution: 2.05  # 2OCJ resolution
      weight: 2.5  # Experimental - HIGHER weight

  consensus_method: weighted  # Use weighted consensus (recommended)
  auto_weight: true           # Auto-assign weights based on type/resolution
  discordance_threshold: 2.0  # Flag if structures disagree by >2 kcal/mol
  require_all: false          # Allow partial failures

foldx:
  binary: tools/foldx/foldx
  rotabase: tools/foldx/rotabase.txt
