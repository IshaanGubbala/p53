output_dir: reports
fig_format: png
tables_dir: reports/tables
figures_dir: reports/figures
top_rescues: 20
rescue_bubble_annotate: 6
rescue_risk_top_n: 12
rescue_position_top_n: 200
rescue_animation_top_n: 1
rescue_animation_frames: 72
rescue_animation_fps: 18
rescue_animation_dpi: 140
rescue_animation_format: gif
rescue_animation_use_mutant_pdb: true
fancy_visualizations: true

# Guide generation settings
guide:
  enabled: true
  output_format: md  # Options: md, pdf (requires pandoc)
  include_glossary: true

# Executive summary settings
executive_summary:
  enabled: true
  top_per_target: 5
  high_conservation_threshold: 0.8
  near_functional_distance: 10.0  # Angstroms
  output_formats:
    - csv
    - tex
