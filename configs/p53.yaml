  # Direct DNA-contacting residues (Box I-V)
  dna_contact:
    - 120  # K120 (Box I)
    - 277  # R273 (Box III, DNA backbone contact)
    - 248  # R248 (Box II-III, DNA backbone)
    - 280  # R280 (Box V, DNA backbone)
    - 282  # R282 (Box V)
    - 283  # K283 (Box V)
    - 196  # R196 (Box II, CRITICAL direct DNA contact)
    - 213  # R213 (DNA contact)
    - 175  # R175 (DNA contact)
    - 273  # R273 (DNA backbone contact)

  # Zinc coordination (structural integrity)
  zinc_coordination:
    - 176  # C176 (Zn2+ ligand)
    - 179  # H179 (Zn2+ ligand)
    - 238  # C238 (Zn2+ ligand)
    - 242  # C242 (Zn2+ ligand)

  # Key phosphorylation sites (regulatory switches)
  phosphorylation:
    - 269  # S269 (PKA phosphorylation, activation switch)
    - 315  # S315 (ATM/ATR phosphorylation)
    - 392  # S392 (C-terminal activation)
    - 15   # S15 (N-terminal, stress response)
    - 20   # S20 (N-terminal, MDM2 regulation)
    - 46   # S46 (apoptosis trigger)

  # Protein-protein interaction hotspots
  mdm2_binding:
    - 19   # F19 (MDM2 hydrophobic pocket)
    - 23   # W23 (MDM2 hydrophobic pocket)
    - 26   # L26 (MDM2 hydrophobic pocket)

  # Structurally critical loop residues
  structural_loops:
    - 229  # C229 (L2 loop, structural stability)
    - 176  # C176 (L2 loop + Zn)
    - 238  # C238 (L3 loop + Zn)
    - 242  # C242 (L3 loop + Zn)

  # Acetylation sites (transcriptional activity)
  acetylation:
    - 120  # K120 (DNA binding + acetylation)
    - 164  # K164 (transcriptional activation)
    - 305  # K305 (C-terminal regulation)
    - 382  # K382 (C-terminal activation)

design:
  max_mutations: 3
  protected_residues: []
structure:
  recompute: false
clinvar:
  enabled: true
  download_xml: true
  download_vcf: true
  vcf_assembly: GRCh38
  decompress_xml: false
  allow_parts: true
  part_size_mb: 1024
  target_gene: TP53
  reparse: false
  parser: auto
  chunk_size: 100000
  element_batch_size: 200
  num_workers: null
labels:
  min_review_stars: 1

# MSA-based conservation analysis
msa:
  enabled: true
  precomputed_path: msa/P04637_conservation.json  # Relative to Data/processed
  min_sequence_identity: 0.5  # Filter homologs below this identity
  max_gap_fraction: 0.3       # Ignore positions with >30% gaps
  database: uniref90          # MAFFT database for homolog search

# Train/test validation
validation:
  enabled: true
  split_ratio: 0.8            # 80% train, 20% test
  split_seed: 42              # Reproducible splits
  stratify_by: clinical_significance  # Maintain benign/pathogenic ratios
  min_variants_per_position: 5  # For per-target metrics
