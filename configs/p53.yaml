uniprot_id: P04637
gene_symbol: TP53
canonical_transcript: NM_000546.5
core_domain:
  start: 94
  end: 312
zinc_binding_residues:
  - 176
  - 179
  - 238
  - 242
design:
  max_mutations: 3
  protected_residues: []
structure:
  recompute: false
clinvar:
  enabled: true
  download_xml: true
  download_vcf: true
  vcf_assembly: GRCh38
  decompress_xml: false
  allow_parts: true
  part_size_mb: 1024
  target_gene: TP53
  reparse: false
  parser: auto
  chunk_size: 100000
  element_batch_size: 200
  num_workers: null
labels:
  min_review_stars: 1

# MSA-based conservation analysis
msa:
  enabled: true
  precomputed_path: Data/processed/msa/P04637_conservation.json
  min_sequence_identity: 0.5  # Filter homologs below this identity
  max_gap_fraction: 0.3       # Ignore positions with >30% gaps
  database: uniref90          # MAFFT database for homolog search

# Train/test validation
validation:
  enabled: true
  split_ratio: 0.8            # 80% train, 20% test
  split_seed: 42              # Reproducible splits
  stratify_by: clinical_significance  # Maintain benign/pathogenic ratios
  min_variants_per_position: 5  # For per-target metrics
