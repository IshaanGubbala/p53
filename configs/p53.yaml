uniprot_id: P04637
gene_symbol: TP53
canonical_transcript: NM_000546.5
core_domain:
  start: 94
  end: 312
zinc_binding_residues:
  - 176
  - 179
  - 238
  - 242

# Functional site annotations (literature-curated)
